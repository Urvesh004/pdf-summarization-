<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocSummarize — AI PDF Summarizer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="main-container">

  <div class="app-header">
    <div class="app-logo">
      <div class="logo-icon">📄</div>
      <span class="logo-text">DocSummarize</span>
    </div>
    <p class="app-tagline">Powered by Groq · Ultra-fast AI Summarization</p>
  </div>

  <div class="upload-card">
    <h1 class="card-title">Upload Your Document</h1>
    <p class="card-subtitle">Get a structured AI summary in seconds</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
      <label class="upload-box" id="uploadBox">
        <input type="file" name="file" id="fileInput" required>

        <div class="upload-content" id="defaultContent">
          <img src="https://cdn-icons-png.flaticon.com/512/2921/2921222.png" alt="upload">
          <h3>Drop your file here</h3>
          <p>or <span>browse files</span></p>
          <small>PDF &nbsp;·&nbsp; DOCX</small>
        </div>

        <div class="file-preview" id="filePreview">
          <img src="https://cdn-icons-png.flaticon.com/512/2991/2991108.png" alt="file">
          <p id="previewName"></p>
          <small>Ready to summarize</small>
        </div>
      </label>

      <button type="submit" class="submit-btn">✦ Generate Summary</button>
    </form>

    <div class="groq-badge">
      <span class="groq-dot"></span>
      Groq LPU · llama-3.3-70b · Instant inference
    </div>
  </div>

</div>

<script>
  const fileInput = document.getElementById("fileInput");
  const defaultContent = document.getElementById("defaultContent");
  const filePreview = document.getElementById("filePreview");
  const previewName = document.getElementById("previewName");

  filePreview.style.display = "none";

  fileInput.addEventListener("change", function () {
    if (this.files.length > 0) {
      defaultContent.style.display = "none";
      filePreview.style.display = "block";
      previewName.textContent = this.files[0].name;
    }
  });
</script>
</body>
</html>
